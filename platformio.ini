[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D PLATFORM_ESP32
    -D GEW_FIRMWARE_VERSION=\"9.2.3-commands-test\"
    ; Set this to the dedicated active-low setup button GPIO on production hardware.
    ; Do not use the EN/reset pin; the CPU cannot time a press while held in reset.
    -D GEW_FACTORY_RESET_PIN=-1
    ; Known-working addressable status LED pin on the gateway hardware.
    -D GEW_PROVISIONING_LED_PIN=21

build_src_filter =
    +<*>
    -<platform/windows/>
    -<cloud/windows/>
    -<network/windows/>
    -<provisioning/windows/>


lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    adafruit/Adafruit NeoPixel@^1.12.3
